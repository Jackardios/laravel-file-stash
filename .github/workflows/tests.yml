name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['^12.61.1', '^13.12']
        # Pinned explicitly: Laravel 13 accepts both majors and would
        # otherwise always resolve Guzzle 8.
        guzzle: ['^7.15.2']
        include:
          # Guzzle 8 needs Laravel 13 (Laravel 12 requires Guzzle 7).
          - php: '8.3'
            laravel: '^13.12'
            guzzle: '^8.0.1'
          - php: '8.5'
            laravel: '^13.12'
            guzzle: '^8.0.1'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Guzzle ${{ matrix.guzzle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, pcntl, posix
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-guzzle-${{ matrix.guzzle }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-guzzle-${{ matrix.guzzle }}-

      - name: Install dependencies
        run: |
          composer require --dev --no-update "laravel/framework:${{ matrix.laravel }}"
          composer require --no-update "guzzlehttp/guzzle:${{ matrix.guzzle }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: composer show | grep -E '^(laravel/framework|guzzlehttp/guzzle|phpunit/phpunit) '

      # The seed is printed so a failing order can be reproduced locally.
      - name: Fast suite (parallel, random order)
        run: |
          echo "Random order seed: ${{ github.run_id }}"
          vendor/bin/paratest --exclude-group concurrency --order-by=random --random-order-seed=${{ github.run_id }}

      - name: Fast suite (sequential, random order)
        run: vendor/bin/phpunit --exclude-group concurrency --order-by=random

      - name: Concurrency suite (real processes)
        run: vendor/bin/phpunit --group concurrency

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Lowest dependencies (PHP 8.3)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, mbstring, pcntl, posix
          coverage: none

      # Composer >= 2.9 blocks packages with known advisories while
      # resolving, so the lowest resolvable set is the lowest safe one.
      - name: Install dependencies (prefer-lowest)
        run: composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Installed versions
        run: composer show | grep -E '^(laravel/framework|guzzlehttp/guzzle|phpunit/phpunit|brianium/paratest|symfony/console) '

      # ParaTest too, so its floor is exercised against the lowest PHPUnit.
      - name: Fast suite (parallel)
        run: vendor/bin/paratest --exclude-group concurrency

      - name: Concurrency suite (real processes)
        run: vendor/bin/phpunit --group concurrency

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            dependencies: lowest
          - php: '8.5'
            dependencies: highest

    name: Quality (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Code style
        if: matrix.dependencies == 'highest'
        run: vendor/bin/pint --test

      - name: Static analysis
        run: composer analyse

      - name: Security advisories and abandoned packages
        run: composer audit

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Coverage and mutation testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # PHP 8.4: the newest version with a released pcov on PECL.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, pcntl, posix
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Coverage
        run: vendor/bin/phpunit --exclude-group concurrency --coverage-text --only-summary-for-coverage-text --coverage-xml=build/coverage/coverage-xml --log-junit=build/coverage/junit.xml

      # setup-php v2 turns `infection:0.35.4@sha256:...` into a non-existent
      # download URL and installs the error page without failing, so the
      # phar is fetched by hand and checked against the GPG-verified release.
      - name: Install Infection
        run: |
          curl -fsSL -o "$RUNNER_TEMP/infection.phar" https://github.com/infection/infection/releases/download/0.35.4/infection.phar
          echo "24e9d2ab5fc5613be6b9fea99cfd2c689234d6e6053f339b8f5e05136246070a  $RUNNER_TEMP/infection.phar" | sha256sum -c -

      - name: Mutation testing
        run: php "$RUNNER_TEMP/infection.phar" --coverage=build/coverage --skip-initial-tests --threads=max --no-progress --min-msi=97 --min-covered-msi=97

  experimental:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Best-effort platform: the cache relies on POSIX semantics
          # (see README, "Windows"); the concurrency suite is skipped there.
          - name: Windows
            os: windows-latest
            php: '8.5'
            install: ''
            # enforceTimeLimit needs pcntl, which Windows lacks; PHPUnit
            # reports that as a runner warning, not a test problem.
            phpunit: '--do-not-fail-on-phpunit-warning'
          - name: PHP 8.6
            os: ubuntu-latest
            php: '8.6'
            install: '--ignore-platform-req=php+'
          # laravel/framework master is the next major; its branch alias
          # (13.0.x-dev) does not satisfy ^13.12, hence the inline alias.
          - name: Laravel next (dev-master)
            os: ubuntu-latest
            php: '8.5'
            install: ''
            laravel: 'dev-master as 13.99.0'
            testbench-core: '12.x-dev as 11.99.0'

    name: Experimental - ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring
          coverage: none

      - name: Use the Laravel development branch
        if: matrix.laravel
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require --dev --no-update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench-core:${{ matrix.testbench-core }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.install }}

      - name: Tests
        run: php vendor/bin/phpunit --display-deprecations ${{ matrix.phpunit }}
