name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['^12.0', '^13.0']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pcntl, posix
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require --dev --no-update laravel/framework:${{ matrix.laravel }}
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Lowest deps (PHP 8.3, prefer-lowest)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pcntl, posix
          coverage: none

      - name: Install dependencies (prefer-lowest)
        run: composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Quality (PHP 8.5, Laravel ^13.0)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, pcntl, posix
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache-quality
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache-quality.outputs.dir }}
          key: quality-${{ runner.os }}-php-8.5-laravel-13-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            quality-${{ runner.os }}-php-8.5-laravel-13-

      - name: Install dependencies
        run: |
          composer require --dev --no-update laravel/framework:^13.0
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        run: composer analyse

      - name: Run tests with coverage
        run: composer test-coverage
